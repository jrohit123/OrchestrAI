[phases.setup]
aptPkgs = [
  "libglib2.0-0",
  "libpango-1.0-0",
  "libpangoft2-1.0-0",
  "libpangocairo-1.0-0",
  "libcairo2",
  "libfontconfig1",
  "libharfbuzz0b",
  "fonts-noto"
]

[phases.build]
cmds = ["pip install -r requirements.txt"]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}"
