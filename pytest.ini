[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    golden: real-LLM, real-DB regression suite for the workflow compiler pipeline (slow, costs API calls; excluded by default — run explicitly with `pytest -m golden`)
addopts =
    -v
    --tb=short
    -m "not golden"
