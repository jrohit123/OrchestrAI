name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check app/
      - run: ruff format --check app/

  # No `test` job: the pytest suite was deliberately removed (commit 7e0bf5e,
  # "Remove pytest test suite and its config") but this workflow wasn't
  # updated to match, so it failed on every push since. Re-add a `test` job
  # here if/when a real test suite comes back.
