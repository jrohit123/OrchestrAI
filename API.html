<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>ProValuate</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      /* max-width: 800px; */
      margin: 40px auto;
      padding: 20px;
    }
    .section {
      border: 2px solid #000080;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 5px;
    }
    .section h2 {
      margin-top: 0;
      color: #333;
    }
    .section.mandatory {
      background-color: #f0f8ff;
      border-color: #4CAF50;
    }
    .section.optional {
      background-color: #fffaf0;
      border-color: #FF9800;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 3px;
      font-weight: bold;
      font-size: 12px;
      margin-left: 10px;
    }
    .badge.mandatory {
      background-color: #4CAF50;
      color: white;
    }
    .badge.optional {
      background-color: #FF9800;
      color: white;
    }
    input[type="file"], button {
      padding: 10px;
      margin: 10px 0;
      font-size: 14px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .feedback {
      font-size: 14px;
      margin-top: 10px;
      padding: 10px;
      border-radius: 3px;
    }
    .feedback.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .feedback.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .feedback.info {
      background-color: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    #fileFeedback {
      font-size: 13px;
      margin-top: 8px;
    }
    .progress {
      display: none;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #4CAF50;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<h1>ProValuate Assessment</h1>

<!-- PART 1: MANDATORY FILES -->
<div class="section mandatory">
  <h2>Step 1: Upload Mandatory Files <span class="badge mandatory">REQUIRED</span></h2>
  
  <form id="mandatoryForm">
    <input type="hidden" name="Header" value="Test"> 
    <input type="hidden" name="Company" value="Company 1"> 
    <input type="hidden" name="Partner" value="OpportuneHR">

    <div>
      <label><strong>Job Description (PDF):</strong></label><br>
      <input type="file" name="job_description" required accept=".pdf,.doc,.docx">
    </div>

    <div>
      <label><strong>Candidate Resumes (max 10):</strong></label><br>
      <input type="file" id="candidatesInput" name="candidates" multiple required accept=".pdf,.doc,.docx" onchange="validateFileCount(this)">
      <div id="fileFeedback" style="font-size:0.95em;color:#666;"></div>
    </div>

    <button type="submit" id="mandatorySubmitBtn">Next: Upload Optional Files</button>
    <div id="mandatoryFeedback"></div>
  </form>
</div>

<!-- PART 2: OPTIONAL FILES -->
<div class="section optional" id="optionalSection" style="display: none;">
  <h2>Step 2: Upload Optional Files <span class="badge optional">OPTIONAL</span></h2>
  
  <form id="optionalForm">
    <div>
      <label><strong>Evaluation Criteria (Excel/PDF/DOC):</strong></label><br>
      <input type="file" id="evalInput" name="evaluation_criteria" accept=".xlsx,.xls,.txt,.pdf,.doc,.docx">
      <div style="font-size: 12px; color: #666; margin-top: 5px;">Leave blank to skip this step</div>
    </div>

    <button type="submit" id="optionalSubmitBtn">Process Assessment</button>
    <div id="optionalFeedback"></div>
  </form>
</div>

<!-- PROGRESS INDICATOR -->
<div class="progress" id="progressIndicator">
  <div class="spinner"></div>
  <p>Processing your assessment...</p>
</div>

<script>
// Store mandatory files for later
let mandatoryFormData = null;

// Validate candidates file count
function validateFileCount(input) {
  const maxFiles = 10;
  const feedback = document.getElementById('fileFeedback');
  const count = input.files ? input.files.length : 0;
  
  if (count === 0) {
    feedback.textContent = '';
    return true;
  }
  if (count > maxFiles) {
    feedback.style.color = '#dc3545';
    feedback.textContent = `You selected ${count} files – maximum allowed is ${maxFiles}. Please select fewer files.`;
    return false;
  }
  feedback.style.color = '#28a745';
  feedback.textContent = `Selected ${count} file${count > 1 ? 's' : ''}`;
  return true;
}

// PART 1: Handle mandatory files submission
document.getElementById('mandatoryForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const candidatesInput = document.getElementById('candidatesInput');
  const mandatoryFeedback = document.getElementById('mandatoryFeedback');
  
  // Validate candidates count
  const candidatesCount = candidatesInput.files ? candidatesInput.files.length : 0;
  if (candidatesCount === 0) {
    showFeedback(mandatoryFeedback, 'Please select at least one candidate resume.', 'error');
    return;
  }
  if (candidatesCount > 10) {
    showFeedback(mandatoryFeedback, 'Maximum 10 files allowed. Please select fewer files.', 'error');
    return;
  }

  // Build FormData with all mandatory files
  mandatoryFormData = new FormData(this);

  // Log for debugging
  console.log('Mandatory FormData:');
  for (let pair of mandatoryFormData.entries()) {
    if (pair[1] instanceof File) {
      console.log(pair[0], ':', { name: pair[1].name, size: pair[1].size });
    } else {
      console.log(pair[0], ':', pair[1]);
    }
  }

  // Show success message and move to optional step
  showFeedback(mandatoryFeedback, 'Mandatory files received! ✓ Now proceed to optional step.', 'success');
  
  // Show optional section
  document.getElementById('optionalSection').style.display = 'block';
  document.getElementById('mandatoryForm').style.opacity = '0.6';
  document.getElementById('mandatorySubmitBtn').disabled = true;
  
  // Scroll to optional section
  setTimeout(() => {
    document.getElementById('optionalSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 500);
});

// PART 2: Handle optional files and final submission
document.getElementById('optionalForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  
  const optionalFeedback = document.getElementById('optionalFeedback');
  
  if (!mandatoryFormData) {
    showFeedback(optionalFeedback, 'Error: Please complete Step 1 first.', 'error');
    return;
  }

  // Add optional file if provided
  const evalInput = document.getElementById('evalInput');
  if (evalInput.files && evalInput.files.length > 0) {
    mandatoryFormData.append('evaluation_criteria', evalInput.files[0]);
    console.log('Added evaluation_criteria file');
  } else {
    console.log('No evaluation_criteria file provided (optional)');
  }

  // Show progress indicator
  document.getElementById('progressIndicator').style.display = 'block';
  document.getElementById('optionalForm').style.opacity = '0.5';
  document.getElementById('optionalSubmitBtn').disabled = true;

  try {
    // Submit to N8N webhook
    const response = await fetch(
      'https://automations.aitamate.com/webhook/ProValuate-Assessment',
      {
        method: 'POST',
        body: mandatoryFormData
      }
    );

    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }

    const contentType = response.headers.get('content-type');
    let result;
    
    if (contentType && contentType.includes('text/html')) {
      result = await response.text();
      document.body.innerHTML = result;
    } else {
      result = await response.json();
      showFeedback(optionalFeedback, 'Assessment completed successfully! ✓', 'success');
      console.log('Response:', result);
      // Optionally display results
      alert('Assessment processed successfully!');
    }

  } catch (error) {
    console.error('Error:', error);
    showFeedback(optionalFeedback, 'Error submitting form: ' + error.message, 'error');
    document.getElementById('progressIndicator').style.display = 'none';
    document.getElementById('optionalForm').style.opacity = '1';
    document.getElementById('optionalSubmitBtn').disabled = false;
  }
});

// Helper function to show feedback messages
function showFeedback(element, message, type) {
  element.textContent = message;
  element.className = `feedback ${type}`;
  element.style.display = 'block';
}
</script>

</body>
</html>
